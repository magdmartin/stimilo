title: stimilo
description: Operations, Process & AI Consultant — Montréal
url: "https://stimilo.com"
baseurl: ""
repository: magdmartin/stimilo
locale: en-US
timezone: America/Toronto

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: default
search: false
breadcrumbs: false
atom_feed:
  hide: true

permalink: /:categories/:year/:month/:day/:title:output_ext

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - tests
  - vendor
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - _work
  - .bundle

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
      related: false
      comments: false
      show_date: true
      toc: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
